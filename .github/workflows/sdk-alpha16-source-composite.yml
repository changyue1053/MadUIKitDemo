name: Exact MadUIKit alpha16 source composite Android compile
on:
  push:
    branches: [ci/sdk-alpha16-source-composite]
    paths:
      - '.github/workflows/sdk-alpha16-source-composite.yml'
      - 'ci/sdk-source-composite/**'
permissions: {contents: read}
concurrency:
  group: sdk-alpha16-source-composite
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'changyue1053/MadUIKitDemo' &&
      github.ref == 'refs/heads/ci/sdk-alpha16-source-composite' &&
      contains(github.event.head_commit.message, 'MADSDK_SOURCE_SMOKE_REVIEWED: f891df864e0a3557f77e46eebff075ff2cb1efdb')
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: f891df864e0a3557f77e46eebff075ff2cb1efdb
          path: ci-input/sdk
          persist-credentials: false
      - name: Check stock tools, resolve exact source, and compile Android only
        run: bash ci/sdk-source-composite/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MadUIKit-alpha16-Android-Source-Composite-Receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mad-source-composite-receipt/composite-status.json
          if-no-files-found: warn
          retention-days: 7
