name: iOS verified synthetic consumer (Intel adapter)
on:
  push:
    branches: [ci/ios-verified-consumer-intel]
    paths:
      - '.github/workflows/ios-verified-consumer.yml'
      - 'ci/ios-verified-consumer/**'
permissions:
  contents: read
concurrency:
  group: ios-verified-consumer-intel
  cancel-in-progress: false
jobs:
  ios-intel:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/ios-verified-consumer-intel'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact public SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - name: Exact verified Codegen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKitCodegen
          ref: 4c12c7b6e9998b7d832b766409c321bbaa12903b
          path: ci-input/codegen
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build verified bundle and launch independent Intel iOS simulator app
        shell: bash
        run: bash ci/ios-verified-consumer/run.sh
      - name: Save public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ios-verified-consumer-intel
          path: ${{ runner.temp }}/mad-ios-verified-evidence
          if-no-files-found: warn
          retention-days: 7
