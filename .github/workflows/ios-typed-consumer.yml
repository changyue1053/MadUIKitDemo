name: Generated typed iOS Maven consumer
on:
  push:
    branches: [ci/ios-typed-consumer]
    paths:
      - '.github/workflows/ios-typed-consumer.yml'
      - 'ci/ios-typed-consumer/**'
permissions:
  contents: read
concurrency:
  group: ios-typed-consumer
  cancel-in-progress: false
jobs:
  ios-intel:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/ios-typed-consumer'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact public SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - name: Exact public typed generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKitCodegen
          ref: 7276d8f3843a91ec5394e527fcbd1a63ad99a712
          path: ci-input/codegen
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build verified bundle and launch independent Intel iOS simulator app
        shell: bash
        run: bash ci/ios-typed-consumer/run.sh
      - name: Save public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ios-typed-consumer
          path: ${{ runner.temp }}/ios-typed-evidence
          if-no-files-found: warn
          retention-days: 7
