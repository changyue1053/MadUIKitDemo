name: Public Android and Apple Silicon iOS same-stage SDK preview
on:
  push:
    branches: [ci/sdk-unified-stage]
    paths:
      - '.github/workflows/sdk-unified-stage.yml'
      - 'ci/sdk-unified-stage/**'
permissions: {contents: read}
concurrency:
  group: sdk-unified-stage
  cancel-in-progress: false
jobs:
  one-stage:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/sdk-unified-stage'
    runs-on: macos-26
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Build both targets from one versioned SDK stage and verify iOS launch
        run: bash ci/sdk-unified-stage/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: MadUIKit-alpha01-Unified-Run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-unified-evidence/deliverable/
          if-no-files-found: error
          retention-days: 7
