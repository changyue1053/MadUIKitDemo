name: Independent ARM64 device framework compile
on:
  push:
    branches: [ci/ios-arm64-adoption]
    paths:
      - '.github/workflows/ios-arm64-adoption.yml'
      - 'ci/ios-arm64-adoption/**'
permissions:
  contents: read
concurrency:
  group: ios-arm64-adoption
  cancel-in-progress: false
jobs:
  ios-intel:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/ios-arm64-adoption'
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact public SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve versioned ARM64 SDK and cross-compile unsigned framework
        shell: bash
        run: bash ci/ios-arm64-adoption/run.sh
      - name: Save public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ios-arm64-adoption
          path: ${{ runner.temp }}/ios-arm64-adoption-evidence
          if-no-files-found: warn
          retention-days: 7
