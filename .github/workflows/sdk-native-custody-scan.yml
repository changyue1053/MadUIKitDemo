name: SDK-only alpha03 local custody scan (no binaries)
on:
  push:
    branches: [ci/sdk-native-custody-typed-class]
    paths:
      - '.github/workflows/sdk-native-custody-scan.yml'
      - 'ci/sdk-native-custody-scan/**'
permissions: {contents: read}
concurrency:
  group: sdk-native-custody-typed-class
  cancel-in-progress: false
jobs:
  scan:
    if: >-
      github.repository == 'changyue1053/MadUIKitDemo' &&
      github.ref == 'refs/heads/ci/sdk-native-custody-typed-class' &&
      contains(github.event.head_commit.message, 'MADSDK_CUSTODY_TYPED_CLASS_REVIEWED: cec44952263f528bb3775f0af63af51b4a04b621')
    runs-on: macos-15-intel
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: cec44952263f528bb3775f0af63af51b4a04b621
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Produce one fresh stage, scan and delete it locally
        run: bash ci/sdk-native-custody-scan/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MadUIKit-alpha03-job-local-custody-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mad-custody-receipt/custody-result.json
          if-no-files-found: warn
          retention-days: 7
