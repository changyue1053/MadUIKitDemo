name: iOS synthetic filter tabs smoke
on:
  push:
    branches: ['ci/ios-filter-tabs-smoke']
    paths:
      - '.github/workflows/ios-synthetic-smoke.yml'
      - 'scripts/ios-ci-smoke.sh'
      - 'scripts/verify-ios-ci-stage.py'
      - 'iosApp/Demo.xcconfig'
      - 'iosApp/Info.plist'
      - 'iosApp/BookFilterUITests.swift'
      - 'iosApp/MadUIKitDemo.xcodeproj/**'
      - 'composeApp/src/commonMain/kotlin/dev/maduikit/demo/DemoScreen.kt'
      - 'scripts/export-ios-smoke-screens.py'
permissions:
  contents: read
concurrency:
  group: ios-filter-tabs-smoke
  cancel-in-progress: true
jobs:
  public-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 38
    steps:
      - name: Check out public Demo smoke branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact public SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - name: Check out exact public Codegen for fixture provenance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: changyue1053/MadUIKitCodegen
          ref: dd05c6c863f0c9de2e62017deadb378dd42f5603
          path: ci-input/codegen
          persist-credentials: false
      - name: Stage SDK, build independent Demo and exercise XCUI tab tap
        shell: bash
        run: bash scripts/ios-ci-smoke.sh
      - name: Upload bounded public smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maduikit-public-ios-filter-tabs-smoke
          path: ${{ runner.temp }}/maduikit-ios-evidence/
          if-no-files-found: warn
          retention-days: 7
