name: Public Android runtime Maven resolution probe
on:
  push:
    branches: [ci/maven-resolution-probe]
    paths: ['ci/maven-resolution-probe/**', '.github/workflows/maven-resolution-probe.yml']
permissions: {contents: read}
concurrency:
  group: public-maven-resolution-probe
  cancel-in-progress: false
jobs:
  public-resolution:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/maven-resolution-probe'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Stage SDK, resolve online, replay offline, compare
        run: bash ci/maven-resolution-probe/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-maven-resolution-receipt
          path: |
            ${{ runner.temp }}/maven-resolution-evidence/runtime-graph.json
            ${{ runner.temp }}/maven-resolution-evidence/stage-sha256.json
            ${{ runner.temp }}/maven-resolution-evidence/summary.json
          if-no-files-found: error
          retention-days: 7
