name: Independent Android SDK Maven adoption
on:
 push:
  branches: [ci/sdk-adoption]
  paths: ['ci/sdk-adoption/**', '.github/workflows/sdk-adoption.yml']
permissions: {contents: read}
jobs:
 adoption:
  runs-on: ubuntu-24.04
  timeout-minutes: 25
  steps:
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
     with: {persist-credentials: false}
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
     with:
      repository: changyue1053/MadUIKit
      ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
      path: ci-input/sdk
      persist-credentials: false
   - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
     with: {distribution: temurin, java-version: '17'}
   - run: bash ci/sdk-adoption/run.sh
   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     if: always()
     with:
      name: public-independent-sdk-adoption
      path: ci-evidence/sdk-adoption
      retention-days: 7
