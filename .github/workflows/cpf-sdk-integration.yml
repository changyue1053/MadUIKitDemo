name: CPF verified native pair capture
on:
  push:
    branches: [ci/cpf-native-capture]
    paths:
      - '.github/workflows/cpf-sdk-integration.yml'
      - 'ci/cpf-sdk/**'
permissions:
  contents: read
concurrency:
  group: cpf-native-capture-probe
  cancel-in-progress: false
jobs:
  cpf-arm64:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/cpf-native-capture'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out only the public probe branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the exact public Codegen input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: changyue1053/MadUIKitCodegen
          ref: b174b847a6e4096924bb1026d1b94a8d9a0c49a8
          path: ci-input/cpf-codegen
          persist-credentials: false
          sparse-checkout: sample-gradient-output
      - name: Check out exact public SDK common sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/cpf-sdk
          persist-credentials: false
      - name: Build and inspect the exact synthetic gradient page
        shell: bash
        run: bash ci/cpf-sdk/link-on-runner.sh
      - name: Retain verified public synthetic native pair only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpf-native-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpf-native-capture/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
