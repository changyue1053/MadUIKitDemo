name: Synthetic S1 iOS framework transfer diagnostic only
on:
  push:
    branches: [ci/sdk-s1-ui-ios-transfer-diagnostic]
    paths:
      - '.github/workflows/sdk-s1-typography.yml'
      - 'ci/sdk-s1-typography/**'
permissions: {contents: read}
concurrency:
  group: sdk-s1-ui-ios-transfer-diagnostic
  cancel-in-progress: false
jobs:
  build-framework:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/sdk-s1-ui-ios-transfer-diagnostic'
    runs-on: macos-15-intel
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Diagnose independent iOS adopter compile and framework
        run: bash ci/sdk-s1-typography/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: S1-ios-framework-scan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mad-s1-evidence/result.txt
            ${{ runner.temp }}/mad-s1-evidence/source.txt
            ${{ runner.temp }}/mad-s1-evidence/link-host-memory.txt
            ${{ runner.temp }}/mad-s1-evidence/java.txt
            ${{ runner.temp }}/mad-s1-evidence/xcode.txt
            ${{ runner.temp }}/mad-s1-evidence/checkpoints.tsv
            ${{ runner.temp }}/mad-s1-evidence/overlay.sha256
            ${{ runner.temp }}/mad-s1-evidence/publisher-configured
            ${{ runner.temp }}/mad-s1-evidence/stage-before.json
            ${{ runner.temp }}/mad-s1-evidence/stage-after-ui.json
            ${{ runner.temp }}/mad-s1-evidence/ui-caller.sha256
            ${{ runner.temp }}/mad-s1-evidence/ui-iosSimulatorArm64CompileKlibraries.txt
            ${{ runner.temp }}/mad-s1-evidence/ios-resolve.json
            ${{ runner.temp }}/mad-s1-evidence/ios-compile.json
            ${{ runner.temp }}/mad-s1-evidence/ios-framework.json
            ${{ runner.temp }}/mad-s1-evidence/ui-ios-platform.txt
            ${{ runner.temp }}/mad-s1-evidence/ui-ios-framework.sha256
            ${{ runner.temp }}/mad-s1-evidence/framework-scan.json
          if-no-files-found: warn
          retention-days: 7
