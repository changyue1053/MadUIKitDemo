name: Synthetic S1 iOS compile and framework diagnostic
on:
  push:
    branches: [ci/sdk-s1-ui-ios-diagnostic]
    paths:
      - '.github/workflows/sdk-s1-typography.yml'
      - 'ci/sdk-s1-typography/**'
permissions: {contents: read}
concurrency:
  group: sdk-s1-ui-ios-diagnostic
  cancel-in-progress: false
jobs:
  stage-compile:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/sdk-s1-ui-ios-diagnostic'
    runs-on: macos-15-intel
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: 19c8c1b1fbe75b7d6a6118fdab42048948de091b
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Diagnose independent iOS adopter compile and framework
        run: bash ci/sdk-s1-typography/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: S1-ui-ios-diagnostic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mad-s1-evidence/
          if-no-files-found: warn
          retention-days: 7
