name: Synthetic alpha19 iOS Atlas transfer without binary export
on:
  push:
    branches: [ci/sdk-alpha19-ios-transfer-nav-button-trait]
    paths:
      - '.github/workflows/sdk-s1-typography.yml'
      - 'ci/sdk-s1-typography/**'
permissions: {contents: read}
concurrency:
  group: sdk-alpha19-ios-transfer-nav-button-trait
  cancel-in-progress: false
jobs:
  build-and-run-without-export:
    if: github.repository == 'changyue1053/MadUIKitDemo' && github.ref == 'refs/heads/ci/sdk-alpha19-ios-transfer-nav-button-trait'
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: changyue1053/MadUIKit
          ref: c84f26b1d3eccecfeed337ed66ef975c95b36fed
          path: ci-input/sdk
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Build iOS framework then run one synthetic XCTest locally
        run: bash ci/sdk-s1-typography/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: S1-ui-ios-local-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mad-s1-evidence/result.txt
            ${{ runner.temp }}/mad-s1-evidence/source.txt
            ${{ runner.temp }}/mad-s1-evidence/link-host-memory.txt
            ${{ runner.temp }}/mad-s1-evidence/java.txt
            ${{ runner.temp }}/mad-s1-evidence/xcode.txt
            ${{ runner.temp }}/mad-s1-evidence/checkpoints.tsv
            ${{ runner.temp }}/mad-s1-evidence/publisher-configured
            ${{ runner.temp }}/mad-s1-evidence/stage-before.json
            ${{ runner.temp }}/mad-s1-evidence/stage-after-ui.json
            ${{ runner.temp }}/mad-s1-evidence/ui-caller.sha256
            ${{ runner.temp }}/mad-s1-evidence/ui-iosSimulatorArm64CompileKlibraries.txt
            ${{ runner.temp }}/mad-s1-evidence/ios-resolve.json
            ${{ runner.temp }}/mad-s1-evidence/ios-compile.json
            ${{ runner.temp }}/mad-s1-evidence/ios-framework.json
            ${{ runner.temp }}/mad-s1-evidence/ui-ios-platform.txt
            ${{ runner.temp }}/mad-s1-evidence/ui-ios-framework.sha256
            ${{ runner.temp }}/mad-s1-evidence/local-framework-sizes.json
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: S1-ios-synthetic-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mad-s1-runtime-receipt/result.txt
            ${{ runner.temp }}/mad-s1-runtime-receipt/xcode.txt
            ${{ runner.temp }}/mad-s1-runtime-receipt/app-plist.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/local-framework-disk.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/framework-platform.txt
            ${{ runner.temp }}/mad-s1-runtime-receipt/frame-validator.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/boot-frame.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/xctest-outcome.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/guest-selected.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/guest-booted.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/runtime.json
            ${{ runner.temp }}/mad-s1-runtime-receipt/S3-alpha19-transfer-progress.png
            ${{ runner.temp }}/mad-s1-runtime-receipt/S3-alpha19-transfer-confirm.png
          if-no-files-found: warn
          retention-days: 7
